name: Source contract monitor
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install .
      - run: python -m municipal_dw.contracts

