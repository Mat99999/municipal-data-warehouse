name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ".[dbt,dashboard,dev]"
      - run: ruff check src tests dashboard
      - run: mypy src
      - run: pytest --cov=municipal_dw --cov-report=term-missing
  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make demo
      - run: make demo # idempotence: stable keys and no duplicate source grain
      - run: docker compose run --rm --entrypoint dbt pipeline test --project-dir dbt --profiles-dir dbt
      - run: make lint
      - run: make benchmark
      - run: docker compose up -d dashboard
      - run: curl --fail --retry 30 --retry-delay 3 --retry-all-errors http://localhost:8501/_stcore/health
      - uses: actions/upload-artifact@v7
        with: {name: query-plans, path: artifacts/benchmark.txt}
