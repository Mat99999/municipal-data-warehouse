name: municipal-data-warehouse
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municipal_dw}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_dev_password}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/bootstrap:/docker-entrypoint-initdb.d:ro
      - ./sql:/app/sql:ro
  pipeline:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-warehouse_admin}:${POSTGRES_PASSWORD:-warehouse_dev_password}@postgres:5432/${POSTGRES_DB:-municipal_dw}
      DBT_PROFILES_DIR: /app/dbt
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    profiles: ["tools"]
  dashboard:
    build: .
    entrypoint: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]
    env_file: [.env]
    environment:
      DASHBOARD_DATABASE_URL: postgresql+psycopg://dashboard_reader:dashboard_reader_password@postgres:5432/${POSTGRES_DB:-municipal_dw}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8501:8501"]
volumes:
  postgres_data:
